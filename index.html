<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishwakarma Swarnakara Sangam - Rate Card</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4af37">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Serif+Telugu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Georgia', serif;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        /* CONTROLS (Input Area) */
        .controls {
            background: white;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border-top: 5px solid #d4af37;
        }
        
        .status-bar {
            font-family: 'Inter', sans-serif; font-size: 11px; color: #666;
            background: #f0f0f0; padding: 10px; border-radius: 6px;
            margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px;
        }
        
        .status-item { display: flex; align-items: center; gap: 8px; }
        .status-dot { height: 8px; width: 8px; background-color: #ccc; border-radius: 50%; display: inline-block; }
        .status-dot.loading { background-color: #ffa500; animation: blink 1s infinite; }
        .status-dot.success { background-color: #25D366; }
        .status-dot.error { background-color: #ff4444; }
        @keyframes blink { 50% { opacity: 0.5; } }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; }

        .actions { display: flex; gap: 8px; margin-top: 15px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; color: white; }
        .btn-print { background-color: #333; }
        .btn-share { background-color: #25D366; }
        .btn-reset { background-color: #d9534f; flex: 0 0 auto; }

        /* THE CARD - FIXED SIZE */
        .card-wrapper {
            width: 420px;
            margin: 0 auto;
        }

        .rate-card {
            position: relative;
            width: 420px;
            background-color: #fff8ee;
            border: 4px solid #d4af37;
            padding: 16px;
            text-align: center;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(212,175,55,0.18) 0%, transparent 65%),
                repeating-linear-gradient(45deg, rgba(212,175,55,0.04) 0px, rgba(212,175,55,0.04) 1px, transparent 1px, transparent 12px),
                repeating-linear-gradient(-45deg, rgba(212,175,55,0.04) 0px, rgba(212,175,55,0.04) 1px, transparent 1px, transparent 12px);
            opacity: 1; z-index: 0;
        }

        .card-content { position: relative; z-index: 1; }

        /* ── NEW HEADER ── */
        .header-section {
            border-bottom: 2px solid #d4af37;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .telugu-title {
            font-family: 'Noto Serif Telugu', serif;
            font-size: 22px;
            font-weight: 700;
            color: #c0000c;
            line-height: 1.3;
            margin-bottom: 2px;
        }

        .reg-no {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            color: #555;
            margin-bottom: 8px;
        }

        .office-bearers {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 6px;
        }

        .bearer {
            flex: 1;
            text-align: center;
        }

        .bearer-role {
            font-family: 'Noto Serif Telugu', serif;
            font-size: 11px;
            color: #25a000;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .bearer-name {
            font-family: 'Noto Serif Telugu', serif;
            font-size: 12px;
            font-weight: 700;
            color: #c0000c;
            line-height: 1.3;
        }

        .bearer-phone {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #000;
            margin-top: 2px;
        }

        /* divider between bearers */
        .bearer-divider {
            width: 1px;
            background: #d4af37;
            align-self: stretch;
        }

        /* logo in centre */
        .header-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 50px;
        }
        .header-logo img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        /* ── DATE & TABLE ── */
        .date-section { margin-bottom: 12px; border-top: 1px dashed #d4af37; border-bottom: 1px dashed #d4af37; padding: 5px 0; }
        #dateDisplay { font-size: 13px; font-weight: bold; color: #444; }

        table { width: 100%; border-collapse: collapse; background: rgba(255, 255, 255, 0.7); border: 1px solid #d4af37; }
        th { background-color: #d4af37; color: white; padding: 8px; font-size: 13px; font-family: 'Noto Serif Telugu', serif; }
        td { padding: 12px 8px; border: 1px solid #d4af37; font-size: 16px; vertical-align: middle; }
        td:first-child { font-family: 'Noto Serif Telugu', serif; font-weight: bold; color: #5a2d0c; text-align: left; }
        .metal-sub { font-size: 11px; color: #666; font-family: 'Inter', sans-serif; display: block; }
        .rate-value { font-family: 'Inter', sans-serif; font-weight: 700; color: #000; font-size: 22px; }

        @media print {
            .controls, .actions { display: none !important; }
            body { padding: 0; background: white; }
            .rate-card { box-shadow: none; border: 4px solid #d4af37 !important; }
        }
    </style>
</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        function init() {
            const now = new Date();
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' };
            document.getElementById('dateDisplay').innerText = now.toLocaleDateString('en-IN', options);

            const sg = localStorage.getItem('Vishwakarma_Swarnakara_Sangam_Gold');
            const ss = localStorage.getItem('Vishwakarma_Swarnakara_Sangam_Silver');
            if (sg) document.getElementById('inputGold').value = sg;
            if (ss) document.getElementById('inputSilver').value = ss;

            updateVisuals();
        }

        function formatINR(n) { return n ? "₹ " + new Intl.NumberFormat('en-IN').format(n) : "-"; }

        function updateVisuals() {
            document.getElementById('dispGold').innerText = formatINR(document.getElementById('inputGold').value);
            document.getElementById('dispSilver').innerText = formatINR(document.getElementById('inputSilver').value);
        }

        function manualUpdate() {
            updateVisuals();
            localStorage.setItem('Vishwakarma_Swarnakara_Sangam_Gold', document.getElementById('inputGold').value);
            localStorage.setItem('Vishwakarma_Swarnakara_Sangam_Silver', document.getElementById('inputSilver').value);
        }

        function resetData() {
            if(confirm("Clear data?")) { localStorage.clear(); location.reload(); }
        }

        async function shareCard() {
            const card = document.getElementById('cardToCapture');
            const btn = document.querySelector('.btn-share');
            btn.innerText = "Generating...";

            try {
                const canvas = await html2canvas(card, {
                    width: 420,
                    height: card.offsetHeight,
                    scale: 3,
                    useCORS: false,
                    allowTaint: false,
                    backgroundColor: "#fff8ee"
                });

                canvas.toBlob(async (blob) => {
                    const file = new File([blob], "Vishwakarma_Swarnakara_Sangam_Rates.png", { type: "image/png" });
                    if (navigator.share && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: 'Gold & Silver Rates' });
                    } else {
                        const link = document.createElement('a');
                        link.href = canvas.toDataURL();
                        link.download = "Vishwakarma_Swarnakara_Sangam_Rates.png";
                        link.click();
                    }
                    btn.innerText = "Share Image";
                });
            } catch (err) { alert("Error sharing: " + err.message); btn.innerText = "Share Image"; }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
        window.onload = init;
    </script>
